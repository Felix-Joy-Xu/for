name: 魔搭全量模型清单

# 每周日 UTC 20:17（北京时间周一 04:17）自动运行，也可手动触发。
# 用 OpenAPI 前缀切片法采集全站 ~22.7 万个模型清单（绕过 3000 翻页窗口上限）。

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: write
  actions: write

jobs:
  crawl-models-full:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install requests

      - name: 恢复清单缓存
        uses: actions/cache@v4
        with:
          path: modelscope_output
          key: ms-models-${{ github.run_id }}
          restore-keys: |
            ms-models-
          save-always: true

      - name: 运行全量清单爬虫（断点续爬）+ 实时进度监控
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python watch_commit.py 0 1800 > /tmp/watch_commit.log 2>&1 &
          WATCH_PID=$!
          python -u crawl_ms_models_full.py || true
          sleep 5
          kill $WATCH_PID 2>/dev/null || true
          cat /tmp/watch_commit.log

      - name: 上传数据产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-models-full-run${{ github.run_number }}
          path: |
            modelscope_output/models_full*.jsonl
            modelscope_output/models_full.json
            modelscope_output/state_ms_models_full.json
          retention-days: 30

      - name: 生成并回写进度文件
        if: always()
        run: |
          python - <<'EOF'
          import json, os, datetime
          base = "modelscope_output"
          total = terms = 0
          try:
              with open(os.path.join(base, "models_full.json"), encoding="utf-8") as f:
                  total = len(json.load(f))
          except Exception as e:
              print("models_full 读取失败:", e)
          try:
              with open(os.path.join(base, "state_ms_models_full.json"), encoding="utf-8") as f:
                  terms = len(json.load(f))
          except Exception as e:
              print("state 读取失败:", e)
          prog = {
              "models": total,
              "termsCompleted": terms,
              "siteTotal": 226815,
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open("progress_models.json", "w", encoding="utf-8") as f:
              json.dump(prog, f, ensure_ascii=False, indent=1)
          print(prog)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress_models.json
          git diff --cached --quiet || git commit -m "data: 全量模型清单进度 $(date -u '+%F %H:%M')"
          git checkout -B main origin/main || true
          git stash push -m "auto-stash-runner" || true
          git pull --rebase origin main || true
          git stash pop || true
          git push origin main || echo "::warning::progress_models.json 推送失败，下次运行会重试"

      - name: 自动续跑（本轮有新增则触发下一轮）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          DONE=$(python -c "import json;print(json.load(open('progress_models.json')).get('models',0))" 2>/dev/null || echo 0)
          DELTA=$(python -c "import json;print(json.load(open('progress_models.json')).get('deltaThisRun',0))" 2>/dev/null || echo 0)
          echo "当前进度: $DONE / 226815, 本轮新增: $DELTA"
          # 停止条件：本轮新增 < 50（爬取已收敛，不再空转）
          if [ "$DELTA" -ge 50 ]; then
            # 防抖：排除当前 run 后，若仍有同 workflow 的 in_progress run 则不重复触发
            sleep 60
            ACTIVE=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=10&status=in_progress" | python -c "import json,sys,os;d=json.load(sys.stdin);me=os.environ.get('CURRENT_RUN_ID','');print(sum(1 for r in d.get('workflow_runs',[]) if '魔搭全量模型清单' in r.get('name','') and str(r.get('id'))!=me))" 2>/dev/null || echo 0)
            if [ "$ACTIVE" -gt 0 ]; then
              echo "已有进行中的同 workflow run，跳过续跑"
            else
              curl -s -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ms_models_full.yml/dispatches" \
                -d '{"ref":"main"}' && echo "已自动触发下一轮爬取" || echo "::warning::自动续跑触发失败"
            fi
          else
            echo "本轮新增 <50，爬取已收敛，停止自动续跑"
          fi
